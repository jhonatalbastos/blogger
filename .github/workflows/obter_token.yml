name: Gerar Blogger Token

on:
  workflow_dispatch:
    inputs:
      etapa:
        description: 'Escolha: 1_obter_link ou 2_trocar_codigo'
        required: true
        default: '1_obter_link'
      auth_code:
        description: 'Cole o codigo aqui (apenas se escolheu a etapa 2)'
        required: false
        default: ''

jobs:
  oauth:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar requests
        run: pip install requests

      - name: Executar Etapa
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
          ETAPA: ${{ github.event.inputs.etapa }}
          AUTH_CODE: ${{ github.event.inputs.auth_code }}
        run: |
          import json, os, urllib.parse, requests

          creds_data = json.loads(os.environ["CREDENTIALS_JSON"])
          cfg = creds_data.get("installed") or creds_data.get("web")
          client_id = cfg["client_id"]
          client_secret = cfg["client_secret"]
          token_uri = cfg.get("token_uri", "https://oauth2.googleapis.com/token")
          redirect_uri = "urn:ietf:wg:oauth:2.0:oob"
          etapa = os.environ.get("ETAPA", "1_obter_link")

          if etapa == "1_obter_link":
              params = {
                  "client_id": client_id,
                  "redirect_uri": redirect_uri,
                  "response_type": "code",
                  "scope": "https://www.googleapis.com/auth/blogger",
                  "access_type": "offline",
                  "prompt": "consent"
              }
              auth_url = "https://accounts.google.com/o/oauth2/auth?" + urllib.parse.urlencode(params)
              print("\n" + "="*70)
              print("PASSO 1: ABRA ESTE LINK NO NAVEGADOR PARA AUTORIZAR:")
              print(auth_url)
              print("="*70 + "\n")
              print("Depois de autorizar, copie o novo codigo gerado na tela.")
              print("Rode novamente este workflow selecionando '2_trocar_codigo' e colando o codigo.")

          elif etapa == "2_trocar_codigo":
              code = os.environ.get("AUTH_CODE", "").strip()
              if not code:
                  print("ERRO: Voce precisa fornecer o codigo no campo auth_code!")
                  exit(1)

              code = urllib.parse.unquote(code)
              payload = {
                  "code": code,
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "redirect_uri": redirect_uri,
                  "grant_type": "authorization_code"
              }

              res = requests.post(token_uri, data=payload)
              data = res.json()

              if "error" in data:
                  print("\nERRO DO GOOGLE:")
                  print(json.dumps(data, indent=2))
                  exit(1)

              token_final = {
                  "token": data.get("access_token"),
                  "refresh_token": data.get("refresh_token"),
                  "token_uri": token_uri,
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "scopes": ["https://www.googleapis.com/auth/blogger"]
              }

              print("\n" + "="*70)
              print("COPIE TODO O CONTEUDO ABAIXO PARA O SECRET BLOGGER_TOKEN_JSON:")
              print(json.dumps(token_final, indent=2))
              print("="*70 + "\n")
          shell: python {0}
