name: Gerar Blogger Token

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Cole aqui o código de autorização do Google'
        required: true

jobs:
  trocar_token:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install google-auth-oauthlib google-api-python-client

      - name: Obter token.json
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
          AUTH_CODE: ${{ github.event.inputs.auth_code }}
        run: |
          python -c '
          import json, os
          from google_auth_oauthlib.flow import InstalledAppFlow

          creds_data = json.loads(os.environ["CREDENTIALS_JSON"])
          flow = InstalledAppFlow.from_client_config(
              creds_data,
              scopes=["https://www.googleapis.com/auth/blogger"],
              redirect_uri="urn:ietf:wg:oauth:2.0:oob"
          )
          flow.fetch_token(code=os.environ["AUTH_CODE"].strip())
          creds = flow.credentials

          print("\n" + "="*60)
          print("COPIE TODO O CONTEUDO ABAIXO PARA O SECRET BLOGGER_TOKEN_JSON:")
          print(creds.to_json())
          print("="*60 + "\n")
          '
