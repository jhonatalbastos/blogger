name: Publicação Automática no Blogger

on:
  schedule:
    # Executa todos os dias às 10:00 UTC (ajuste conforme o fuso horário pretendido)
    - cron: '0 10 * * *'
  # Permite disparar o script manualmente pela aba "Actions" do GitHub
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o Repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restaurar token.json a partir do Secret
        run: |
          echo '${{ secrets.BLOGGER_TOKEN_JSON }}' > token.json

      - name: Executar Script de Publicação
        env:
          BLOGGER_ID: ${{ secrets.BLOGGER_ID }}
        run: |
          python main.py
